# Tests on every change, and a Windows "walking skeleton": the installer is built and the built program must start,
# serve its pages and write its data to SBO_HOME. Publishing releases is decided later (docs/ROADMAP.md, phase 12).
name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (engine, security, search, several PCs)
        working-directory: tests
        run: python -m unittest test_unit test_convergence test_erase test_resolvers test_auth test_query test_search test_layers test_secrets_in_logs test_multinode

  windows-installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" ordered-set zstandard
          choco upgrade innosetup -y --no-progress
      - name: Build SBO.exe and the installer
        run: python tools/build_windows.py
      - name: Check that the built program starts and serves its pages
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP 'sbo-home'
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          '{"port": 18110, "sync_port": 18463, "open_browser": false}' | Set-Content (Join-Path $home_dir 'config.json')
          $env:SBO_HOME = $home_dir
          $p = Start-Process -FilePath build\sbo_main.dist\SBO.exe -ArgumentList '--background' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $s = Invoke-RestMethod http://127.0.0.1:18110/api/auth/status
              $page = (Invoke-WebRequest http://127.0.0.1:18110/ -UseBasicParsing).Content
              $js = (Invoke-WebRequest http://127.0.0.1:18110/js/app.js -UseBasicParsing).StatusCode
              if ($s.about.installed -and $page -match 'Self Business OS' -and $js -eq 200) { $ok = $true }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content (Join-Path $home_dir 'data\logs\server.log') -ErrorAction SilentlyContinue; throw 'SBO.exe did not start correctly' }
          if (-not (Test-Path (Join-Path $home_dir 'data\auth.db'))) { throw 'data was not written to SBO_HOME' }
          Write-Host 'SBO.exe started and served its pages'
      - uses: actions/upload-artifact@v4
        with:
          name: SBO-Setup
          path: dist/SBO-Setup-*.exe
          retention-days: 14
